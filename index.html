<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Ateliê Mágico</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
:root{--bg:#ffe4f1;--panel:#ffffff;--ink:#5a2a63;--accent:#ff4fa3;--tab:#ffc2e0;--line:#7a3b8a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#3a1d4a;--panel:#4d2a63;--ink:#ffe8f5;--accent:#ff7ac0;--tab:#c76bb3;--line:#ffe8f5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#3a1d4a;--panel:#4d2a63;--ink:#ffe8f5;--accent:#ff7ac0;--tab:#c76bb3;--line:#ffe8f5;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka","Comic Sans MS","Trebuchet MS",sans-serif;font-weight:500}
main{max-width:980px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:clamp(22px,5vw,36px);margin:4px 0 10px;font-weight:700;flex:1;text-align:center}
#stars{font-size:20px;font-weight:700;min-width:70px}
button{font:inherit;color:var(--ink);cursor:pointer;border:3px solid var(--line);background:var(--panel);border-radius:18px;padding:8px 14px;font-size:18px;min-height:48px}
button:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
button:active{transform:scale(.95)}
button.on{background:var(--tab);color:#4a1f55;box-shadow:0 4px 0 var(--line)}
.back{margin-bottom:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.sep{width:6px}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:8px}
.hub .card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;border-radius:26px;font-size:20px;font-weight:700;box-shadow:0 6px 0 var(--line)}
.hub .card span{font-size:56px;line-height:1}
.paper{background:#fff;border:4px solid var(--line);border-radius:22px;overflow:hidden;line-height:0}
canvas{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair}
svg.page{width:100%;height:auto;display:block;background:#fff;max-height:70vh}
svg.page .f{fill:#fff;stroke:#5a2a63;stroke-width:5;stroke-linejoin:round;cursor:pointer}
#tops{pointer-events:none}
.pal{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.sw{width:52px;height:52px;border-radius:50%;padding:0;border:4px solid var(--line)}
.sw.on{transform:scale(1.2);box-shadow:0 0 0 4px var(--accent)}
.hide{display:none!important}
.hint{text-align:center;margin:8px 0 0;font-size:17px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:0 auto}
.mc{aspect-ratio:1;font-size:clamp(30px,9vw,54px);padding:0;border-radius:20px;background:var(--tab);line-height:1}
.mc.open{background:#fff}
.mc.done{background:#c9f7d8}
#bb{position:relative;height:min(60vh,420px);overflow:hidden;border:4px solid var(--line);border-radius:22px;background:linear-gradient(#d8f0ff,#f6e1ff);touch-action:manipulation}
.bub{position:absolute;bottom:-110px;border-radius:50%;opacity:.92;border:2px solid #fff;animation:rise linear forwards;cursor:pointer}
.bub.pop{scale:1.6;opacity:0;transition:scale .2s,opacity .2s}
@keyframes rise{to{transform:translateY(calc(-1 * var(--h)))}}
#gar{position:relative;height:min(60vh,400px);overflow:hidden;border:4px solid var(--line);border-radius:22px;background:linear-gradient(#bde9ff 0 50%,#9be58f 50%);touch-action:manipulation;cursor:pointer}
.pl{position:absolute;font-size:38px;line-height:1;transform:translate(-50%,-70%);pointer-events:none}
.grow{animation:gr .4s}
@keyframes gr{from{scale:.3}to{scale:1}}
#st{touch-action:none;user-select:none;-webkit-user-select:none}
#tray{margin-top:6px}
button:disabled{cursor:default}
</style>
</head>
<body>
<main>
  <header>
    <button id="home" data-go="home" aria-label="Início">🏠</button>
    <h1>🎀 Meu Ateliê Mágico</h1>
    <div id="stars">⭐ 0</div>
  </header>

  <section data-s="home">
    <p class="hint">O que vamos fazer hoje?</p>
    <div class="hub">
      <button class="card" data-go="draw"><span>✏️</span>Desenhar</button>
      <button class="card" data-go="color"><span>🖍️</span>Colorir</button>
      <button class="card" data-go="dress"><span>👗</span>Vestir a princesa</button>
      <button class="card" data-go="cake"><span>🧁</span>Cupcake</button>
      <button class="card" data-go="gar"><span>🌷</span>Jardim</button>
      <button class="card" data-go="mem"><span>🃏</span>Memória</button>
      <button class="card" data-go="bub"><span>🫧</span>Bolhas</button>
    </div>
  </section>

  <section data-s="draw" class="hide">
    <div class="bar" id="tools">
      <button data-t="pen" class="on">✏️ Lápis</button>
      <button data-t="brush">🖌️ Pincel</button>
      <button data-t="rainbow">🌈 Arco-íris</button>
      <button data-t="stamp">Carimbo</button>
      <button data-t="eraser">🧽 Borracha</button>
    </div>
    <div class="bar" id="sizes">
      <button data-s="6">• Fino</button>
      <button data-s="14" class="on">● Médio</button>
      <button data-s="30">⬤ Grosso</button>
      <span class="sep"></span>
      <button id="stamps">🦄</button>
      <button id="undo">↩️ Desfazer</button>
      <button id="clear">🗑️ Limpar</button>
    </div>
    <div class="paper"><canvas id="cv" width="900" height="600" aria-label="Área de desenho"></canvas></div>
  </section>

  <section data-s="color" class="hide">
    <div class="bar" id="pages">
      <button data-p="0" class="on">🏰 Castelo</button>
      <button data-p="4">🦄 Unicórnio</button>
      <button data-p="5">👗 Vestido</button>
      <button data-p="6">🧁 Cupcake</button>
      <button data-p="7">🍦 Sorvete</button>
      <button data-p="8">🐱 Gatinho</button>
      <button data-p="9">🌈 Arco-íris</button>
      <button data-p="10">🐞 Joaninha</button>
      <button data-p="2">🌼 Flor</button>
      <button data-p="3">🦋 Borboleta</button>
      <button data-p="1">🐟 Peixe</button>
      <button id="reset">🗑️ Limpar</button>
    </div>
    <div class="paper" id="svgBox"></div>
    <p class="hint">Escolha uma cor e toque no desenho para pintar.</p>
  </section>

  <section data-s="ed" class="hide">
    <div class="bar" id="eopts"></div>
    <div class="paper"><svg id="st" class="page" viewBox="0 0 400 400" aria-label="Cenário"></svg></div>
    <div class="bar" id="ctl" style="margin-top:10px">
      <button data-a="min">➖ Menor</button>
      <button data-a="plus">➕ Maior</button>
      <button data-a="rot">↻ Girar</button>
      <button data-a="flip">↔ Espelhar</button>
      <button data-a="del">🗑️ Tirar</button>
      <button id="eclr">Limpar tudo</button>
    </div>
    <p class="hint">Toque num enfeite para colocar. Arraste para onde quiser: as roupas encaixam sozinhas perto do corpinho!</p>
    <div class="bar" id="tray"></div>
  </section>

  <section data-s="mem" class="hide">
    <div class="bar"><button id="memNew">🔄 Novo jogo</button></div>
    <p class="hint" id="mmsg"></p>
    <div class="mem" id="mem"></div>
  </section>

  <section data-s="bub" class="hide">
    <p class="hint">Estoure as bolhas! Estouradas: <b id="score">0</b></p>
    <div id="bb" aria-label="Bolhas"></div>
  </section>

  <div class="pal hide" id="pal" aria-label="Cores"></div>
</main>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var COLORS=["#ff4fa3","#ff9ecb","#b57bff","#6ec6ff","#5de0b0","#ffd84d","#ff8a5c","#ff4757","#8b5a2b","#ffffff"];
  var color=COLORS[0], tool="pen", size=14, hue=0, cur="home", stars=0;
  var STAMPS=["🦄","⭐","❤️","🌈","🦋","🌸","👑","🧁","🐱"], si=0;
  var PALS={draw:1,color:1};

  function addStars(n){stars+=n;$("#stars").textContent="⭐ "+stars}
  var ac;
  function beep(f){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.stop(ac.currentTime+.2)}catch(e){}}

  function go(n){
    cur=n;
    var sec=SC[n]?"ed":n;[].forEach.call(document.querySelectorAll("[data-s]"),function(s){s.classList.toggle("hide",s.dataset.s!==sec)});if(SC[n])openSc(n);
    $("#pal").classList.toggle("hide",!PALS[n]);
    $("#home").classList.toggle("hide",n==="home");
    if(n==="mem")newMem();
    if(n==="bub")$("#bb").innerHTML="";
  }
  document.addEventListener("click",function(e){var b=e.target.closest("[data-go]");if(b)go(b.dataset.go)});

  // Paleta
  var pal=$("#pal");
  COLORS.forEach(function(c,i){
    var b=document.createElement("button");
    b.className="sw"+(i===0?" on":"");
    b.style.background=c; b.setAttribute("aria-label","Cor "+(i+1));
    b.onclick=function(){color=c;[].forEach.call(pal.children,function(x){x.classList.remove("on")});b.classList.add("on")};
    pal.appendChild(b);
  });
  function group(id,attr,cb){
    var box=$("#"+id);
    box.addEventListener("click",function(e){
      var b=e.target.closest("button[data-"+attr+"]"); if(!b)return;
      [].forEach.call(box.querySelectorAll("button[data-"+attr+"]"),function(x){x.classList.remove("on")});
      b.classList.add("on"); cb(b.dataset[attr]);
    });
  }

  // Desenhar
  var cv=$("#cv"), ctx=cv.getContext("2d"), W=cv.width, H=cv.height;
  var undoStack=[], drawing=false, last=null;
  function paper(){ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H)}
  paper();
  function snap(){undoStack.push(ctx.getImageData(0,0,W,H)); if(undoStack.length>15)undoStack.shift()}
  function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
  function seg(a,b){
    ctx.lineCap="round"; ctx.lineJoin="round"; var w=size;
    if(tool==="brush")w=size*2.2;
    if(tool==="eraser"){w=size*2.5;ctx.strokeStyle="#fff"}
    else if(tool==="rainbow"){hue=(hue+5)%360;ctx.strokeStyle="hsl("+hue+",90%,55%)";w=size*1.4}
    else ctx.strokeStyle=color;
    ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  cv.addEventListener("pointerdown",function(e){
    e.preventDefault(); cv.setPointerCapture(e.pointerId); snap();
    var p=pos(e);
    if(tool==="stamp"){ctx.font=(size*4+30)+"px serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(STAMPS[si],p.x,p.y);return}
    drawing=true; last=p; seg(p,{x:p.x+.01,y:p.y+.01});
  });
  cv.addEventListener("pointermove",function(e){if(!drawing)return;var p=pos(e);seg(last,p);last=p});
  ["pointerup","pointercancel"].forEach(function(n){cv.addEventListener(n,function(){drawing=false})});
  group("tools","t",function(v){tool=v});
  group("sizes","s",function(v){size=+v});
  $("#stamps").onclick=function(){
    si=(si+1)%STAMPS.length; this.textContent=STAMPS[si]; tool="stamp";
    [].forEach.call(document.querySelectorAll("#tools button"),function(x){x.classList.toggle("on",x.dataset.t==="stamp")});
  };
  $("#undo").onclick=function(){var s=undoStack.pop(); if(s)ctx.putImageData(s,0,0)};
  $("#clear").onclick=function(){snap();paper()};

  // Colorir
  var PAGES=[
    '<rect class="f" x="0" y="250" width="400" height="50"/><rect class="f" x="120" y="140" width="160" height="110"/><rect class="f" x="80" y="110" width="50" height="140"/><rect class="f" x="270" y="110" width="50" height="140"/><polygon class="f" points="70,110 105,45 140,110"/><polygon class="f" points="260,110 295,45 330,110"/><rect class="f" x="180" y="185" width="40" height="65"/><circle class="f" cx="105" cy="150" r="12"/><circle class="f" cx="295" cy="150" r="12"/><circle class="f" cx="340" cy="45" r="30"/>',
    '<rect class="f" x="0" y="0" width="400" height="300"/><ellipse class="f" cx="170" cy="150" rx="110" ry="70"/><polygon class="f" points="270,150 360,90 360,210"/><circle class="f" cx="115" cy="130" r="14"/><circle class="f" cx="50" cy="60" r="16"/><circle class="f" cx="85" cy="35" r="10"/><circle class="f" cx="30" cy="110" r="8"/>',
    '<rect class="f" x="0" y="250" width="400" height="50"/><rect class="f" x="190" y="150" width="20" height="105"/><ellipse class="f" cx="245" cy="215" rx="38" ry="16"/><circle class="f" cx="200" cy="55" r="38"/><circle class="f" cx="255" cy="95" r="38"/><circle class="f" cx="145" cy="95" r="38"/><circle class="f" cx="170" cy="150" r="38"/><circle class="f" cx="230" cy="150" r="38"/><circle class="f" cx="200" cy="105" r="32"/>',
    '<ellipse class="f" cx="130" cy="110" rx="75" ry="60"/><ellipse class="f" cx="270" cy="110" rx="75" ry="60"/><ellipse class="f" cx="150" cy="200" rx="55" ry="45"/><ellipse class="f" cx="250" cy="200" rx="55" ry="45"/><ellipse class="f" cx="200" cy="150" rx="14" ry="75"/><circle class="f" cx="115" cy="105" r="18"/><circle class="f" cx="285" cy="105" r="18"/>',
  '<path class="f" d="M92 150C78 90 50 80 42 120c-4 30 40 60 66 60z" style="display:none"/><ellipse class="f" cx="110" cy="130" rx="28" ry="26"/><ellipse class="f" cx="98" cy="180" rx="28" ry="26"/><ellipse class="f" cx="105" cy="228" rx="24" ry="22"/><polygon class="f" points="140,95 130,45 178,80"/><polygon class="f" points="270,95 280,45 232,80"/><ellipse class="f" cx="205" cy="170" rx="80" ry="95"/><ellipse class="f" cx="205" cy="228" rx="46" ry="30"/><polygon class="f" points="190,90 205,10 220,90"/><circle class="f" cx="175" cy="160" r="11"/><circle class="f" cx="235" cy="160" r="11"/><circle class="f" cx="190" cy="232" r="5"/><circle class="f" cx="220" cy="232" r="5"/>',
  '<polygon class="f" points="170,60 230,60 242,130 158,130"/><polygon class="f" points="158,130 242,130 335,285 65,285"/><circle class="f" cx="160" cy="80" r="22"/><circle class="f" cx="240" cy="80" r="22"/><rect class="f" x="158" y="124" width="84" height="16" rx="6"/><path class="f" d="M200 250C168 228 162 200 180 192c10-5 17 0 20 9 3-9 10-14 20-9 18 8 12 36-20 58z"/><circle class="f" cx="200" cy="38" r="18"/>',
  '<polygon class="f" points="140,150 260,150 240,275 160,275"/><ellipse class="f" cx="200" cy="145" rx="82" ry="28"/><circle class="f" cx="160" cy="112" r="38"/><circle class="f" cx="240" cy="112" r="38"/><circle class="f" cx="200" cy="80" r="38"/><circle class="f" cx="200" cy="38" r="16"/>',
  '<polygon class="f" points="150,150 250,150 200,288"/><circle class="f" cx="200" cy="128" r="52"/><circle class="f" cx="200" cy="72" r="42"/><circle class="f" cx="200" cy="26" r="14"/>',
  '<polygon class="f" points="130,100 140,35 187,75"/><polygon class="f" points="270,100 260,35 213,75"/><ellipse class="f" cx="200" cy="250" rx="62" ry="42"/><circle class="f" cx="200" cy="150" r="80"/><circle class="f" cx="170" cy="140" r="12"/><circle class="f" cx="230" cy="140" r="12"/><polygon class="f" points="188,168 212,168 200,184"/>',
  '<path class="f" d="M40 250A160 160 0 0 1 360 250H330A130 130 0 0 0 70 250z"/><path class="f" d="M70 250A130 130 0 0 1 330 250H300A100 100 0 0 0 100 250z"/><path class="f" d="M100 250A100 100 0 0 1 300 250H270A70 70 0 0 0 130 250z"/><path class="f" d="M130 250A70 70 0 0 1 270 250H240A40 40 0 0 0 160 250z"/><circle class="f" cx="50" cy="258" r="26"/><circle class="f" cx="85" cy="265" r="22"/><circle class="f" cx="350" cy="258" r="26"/><circle class="f" cx="315" cy="265" r="22"/>',
  '<circle class="f" cx="200" cy="175" r="90"/><circle class="f" cx="200" cy="72" r="40"/><circle class="f" cx="160" cy="150" r="18"/><circle class="f" cx="240" cy="150" r="18"/><circle class="f" cx="160" cy="210" r="16"/><circle class="f" cx="240" cy="210" r="16"/><circle class="f" cx="200" cy="235" r="14"/><path d="M200 112V265" stroke="#5a2a63" stroke-width="5" pointer-events="none"/><path d="M185 40Q170 12 158 16M215 40Q230 12 242 16" fill="none" stroke="#5a2a63" stroke-width="5" pointer-events="none"/>'
  ];
  var box=$("#svgBox"), cp=0;
  function showPage(i){box.innerHTML='<svg class="page" viewBox="0 0 400 300" role="img" aria-label="Desenho para colorir">'+PAGES[i]+'</svg>'}
  showPage(0);
  box.addEventListener("click",function(e){if(e.target.classList.contains("f"))e.target.style.fill=color});
  group("pages","p",function(v){cp=+v;showPage(cp)});
  $("#reset").onclick=function(){showPage(cp)};

  // Editor de enfeites: princesa, cupcake e jardim
  function v(a,i){return a[(i|0)%a.length]}
  function P(n,x,y,d,rx,ry,f){var s="";for(var i=0;i<n;i++)s+='<ellipse cx="'+x+'" cy="'+(y-d)+'" rx="'+rx+'" ry="'+ry+'" fill="'+f+'" transform="rotate('+(360/n*i)+' '+x+' '+y+')"/>';return s}
  var HEART='<path d="M50 90C8 60 4 32 22 18c12-9 24-4 28 8 4-12 16-17 28-8 18 14 14 42-28 72z" fill="#ff4f7b" stroke="#d62a5a" stroke-width="3" stroke-linejoin="round"/>';
  var SPARK='<path d="M50 4l10 34 34 12-34 12-10 34-10-34-34-12 34-12z" fill="#ffe27a" stroke="#f5b700" stroke-width="3" stroke-linejoin="round"/>';
  var STEM='<path d="M50 50V96" stroke="#3fae52" stroke-width="6" stroke-linecap="round"/><path d="M50 84q-22 0-26-18 22 0 26 18zM50 72q22 0 26-18-22 0-26 18z" fill="#3fae52"/>';
  var HAIR=["#4a2c1a","#f2c14e","#ff6b9d","#b57bff","#d94a38","#111111"], SKIN=["#ffe0c7","#f5c9a0","#d9a066","#a8714a","#7a4b2e"];
  var BGP=["#ffe9f4","#e4f3ff","#e9ffe8","#fff7d6"], FROST=["#ff9ecb","#a8f0d0","#c9a4ff","#8b5a2b","#fff4a8"], CUP=["#ffb3d9","#8fd3ff","#ffd84d","#c9a4ff"];
  var SKY=[["#bde9ff","#e6f6ff"],["#ff9a8b","#ffe0b3"],["#2b2f6b","#7a66d6"]];

  var SC={
    dress:{
      opts:[{k:"hair",n:"💇‍♀️ Cabelo",c:6},{k:"skin",n:"🧒 Pele",c:5},{k:"bg",n:"🖼️ Fundo",c:4}],
      base:function(o){var h=v(HAIR,o.hair),s=v(SKIN,o.skin);return[
        '<rect width="400" height="400" fill="'+v(BGP,o.bg)+'"/>',
        '<g fill="'+h+'"><ellipse cx="200" cy="120" rx="64" ry="72"/><rect x="136" y="120" width="128" height="110" rx="30"/></g>'+
        '<g fill="'+s+'"><rect x="185" y="150" width="30" height="40"/><rect x="178" y="290" width="18" height="70"/><rect x="204" y="290" width="18" height="70"/>'+
        '<rect x="148" y="185" width="14" height="90" rx="7" transform="rotate(10 155 185)"/><rect x="238" y="185" width="14" height="90" rx="7" transform="rotate(-10 245 185)"/></g>'+
        '<ellipse cx="187" cy="366" rx="20" ry="9" fill="#d94a7a"/><ellipse cx="213" cy="366" rx="20" ry="9" fill="#d94a7a"/>'+
        '<path d="M168 178h64l12 118H156z" fill="#fff6fb" stroke="#f2c6dc" stroke-width="3"/>'+
        '<circle cx="200" cy="112" r="46" fill="'+s+'"/><ellipse cx="200" cy="80" rx="50" ry="24" fill="'+h+'"/>'+
        '<circle cx="184" cy="116" r="4.5" fill="#222"/><circle cx="216" cy="116" r="4.5" fill="#222"/><circle cx="174" cy="128" r="7" fill="#ff9ecb" opacity=".6"/><circle cx="226" cy="128" r="7" fill="#ff9ecb" opacity=".6"/>'+
